<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>这里什么都没有 · 别慌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="paper">
  <header class="topbar">
    <div class="brand"><span class="brand-name">别慌</span><span class="brand-sub">一个不用慌的角落</span></div>
    <div class="lang-switch" role="group" aria-label="Language / 语言">
      <button type="button" class="lang-btn is-active" data-lang="zh" aria-pressed="true">中</button>
      <span class="lang-sep" aria-hidden="true">/</span>
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <section class="hero">
    <p class="hero-kicker">慌啥子嘛</p>
    <h1 class="hero-title">这一页，<em>不在。</em></h1>
    <p class="hero-line">不找了也行，回去坐一会儿。</p>
  </section>
  <p class="foot-line" style="margin-top:40px"><a href="/">回到那个角落</a></p>
</div>
<script src="i18n.js" defer></script>
</body>
</html>
